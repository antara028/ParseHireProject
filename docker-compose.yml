services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/resume_parser_database
      RECORDS_DB_HOST: db
      RECORDS_DB_NAME: resume_parser_database
      RECORDS_DB_USER: postgres
      RECORDS_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resume_parser_database
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_parser_database"]
      interval: 5s
      retries: 10

volumes:
  pgdata: