<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ParseHire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="ParseHire logo" class="logo-img">
      <span class="brand">ParseHire</span>
    </div>
  </header>

  <main class="wrap auth-wrap">
    <section class="intro">
      <h1>Create your account.</h1>
      <p>Start screening candidates in minutes.</p>
    </section>

    {% if error %}
      <div class="notice notice-error">{{ error }}</div>
    {% endif %}

    <form action="/signup" method="post" class="panel auth-panel">
      <div class="field">
        <label for="company_name">Company name</label>
        <input type="text" id="company_name" name="company_name" placeholder="Acme Inc." required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </div>

      <button type="submit" class="btn">Sign Up</button>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </form>
  </main>

</body>
</html>
